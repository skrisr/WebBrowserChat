<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単一ファイル AIチャット</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-color: #6366f1;
      --msg-user-bg: #6366f1;
      --msg-user-text: #ffffff;
      --msg-bot-bg: #334155;
      --msg-bot-text: #f8fafc;
      --input-bg: #0f172a;
      --input-border: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 85vh;
      max-height: 700px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    /* ヘッダー */
    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-avatar-badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .header-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
      display: inline-block;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .btn-clear:hover {
      color: var(--text-main);
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    /* メッセージ領域 */
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-row {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.bot {
      align-self: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message-row.user .message-bubble {
      background-color: var(--msg-user-bg);
      color: var(--msg-user-text);
      border-top-right-radius: 4px;
    }

    .message-row.bot .message-bubble {
      background-color: var(--msg-bot-bg);
      color: var(--msg-bot-text);
      border-top-left-radius: 4px;
      border: 1px solid var(--card-border);
    }

    /* 入力エリア */
    .chat-footer {
      padding: 16px;
      border-top: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.1);
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 24px;
      outline: none;
      font-size: 0.95rem;
    }

    .chat-input:focus {
      border-color: var(--primary-color);
    }

    .btn-send {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-send:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header class="chat-header">
      <div class="header-info">
        <div class="bot-avatar-badge">🤖</div>
        <div class="header-text">
          <h1>AI アシスタント</h1>
          <p><span class="online-dot"></span> 単一HTMLファイル動作中</p>
        </div>
      </div>
      <button class="btn-clear" id="clearBtn">履歴削除</button>
    </header>

    <div class="chat-messages" id="chatMessages"></div>

    <footer class="chat-footer">
      <form class="input-wrapper" id="chatForm">
        <input 
          type="text" 
          class="chat-input" 
          id="messageInput" 
          placeholder="メッセージを入力..." 
          autocomplete="off"
        />
        <button type="submit" class="btn-send">送信</button>
      </form>
    </footer>
  </div>

  <script>
    (function() {
      const STORAGE_KEY = 'single_file_chat_history';
      const messagesContainer = document.getElementById('chatMessages');
      const chatForm = document.getElementById('chatForm');
      const messageInput = document.getElementById('messageInput');
      const clearBtn = document.getElementById('clearBtn');

      let messages = [];

      // 効果音再生機能（Web Audio APIを使用するため外部音声ファイル不要）
      function playSound(isSend) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (isSend) {
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
          } else {
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.12);
          }
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } catch(e) {}
      }

      function loadMessages() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { messages = JSON.parse(saved); } catch(e) {}
        }
        if (messages.length === 0) {
          messages = [{
            sender: 'bot',
            text: 'こんにちは！👋 これは完全に1つのHTMLファイルだけで動作するチャットサイトです。サーバーなしで動きます！'
          }];
        }
        render();
      }

      function saveMessages() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
      }

      function render() {
        messagesContainer.innerHTML = '';
        messages.forEach(msg => {
          const isUser = msg.sender === 'user';
          const row = document.createElement('div');
          row.className = `message-row ${isUser ? 'user' : 'bot'}`;
          
          row.innerHTML = `
            <div class="avatar">${isUser ? '👤' : '🤖'}</div>
            <div class="message-bubble">${msg.text.replace(/\n/g, '<br>')}</div>
          `;
          messagesContainer.appendChild(row);
        });
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = messageInput.value.trim();
        if (!text) return;

        messageInput.value = '';
        messages.push({ sender: 'user', text: text });
        saveMessages();
        render();
        playSound(true);

        // 応答のシミュレーション
        setTimeout(() => {
          let reply = `「${text}」ですね！このメッセージのやり取りもブラウザ（LocalStorage）に保存されています。`;
          if (text.includes('こんにちは')) reply = 'こんにちは！単一ファイルでスムーズに動作しています✨';
          if (text.includes('使い方') || text.includes('仕組み')) reply = 'このHTMLファイルをPCやスマホに保存すれば、ダブルクリックするだけでどこでも開いて使えます！';

          messages.push({ sender: 'bot', text: reply });
          saveMessages();
          render();
          playSound(false);
        }, 800);
      });

      clearBtn.addEventListener('click', () => {
        if (confirm('会話履歴をリセットしますか？')) {
          localStorage.removeItem(STORAGE_KEY);
          messages = [];
          loadMessages();
        }
      });

      loadMessages();
    })();
  </script>
</body>
</html>
